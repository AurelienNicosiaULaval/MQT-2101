project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll
    - modules/semaine-01-introduction/data/diagnostic_succursales.csv
    - modules/semaine-01-introduction/data/birth_us.csv
    - modules/semaine-01-introduction/data/safety_airlines.csv
    - modules/semaine-02-r-quarto/data/ventes_operations_quebec.csv
    - modules/atelier-01-r/data/ventes_pme_quebec.csv
  render:
    - index.qmd
    - plan-de-cours.qmd
    - calendrier.qmd
    - roadmap.qmd
    - migration-ancien-materiel.qmd
    - installation.qmd
    - modules/**/*.qmd
    - "!modules/**/solutions.qmd"
    - evaluations/**/*.qmd
    - ressources/**/*.qmd
    - donnees/index.qmd

