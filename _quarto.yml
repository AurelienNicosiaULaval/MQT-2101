format:
  html:
    lang: fr
    theme:
      - assets/style.scss
    css:
      - assets/css/styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    include-after-body:
      - assets/includes/gpt-assistant-widget.html
      - assets/includes/copy-code-buttons.html
    embed-resources: true

execute:
  warning: false
  message: false
