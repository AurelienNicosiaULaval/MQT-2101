name: Mettre en forme et vérifier le parcours complet du module 09
on:
  push:
    branches: ['verification/parcours-final-module09-20261118']
permissions:
  contents: write
jobs:
  module09:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MQT_PLAYWRIGHT_MODULE: /tmp/lecteur/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Préparer R, Chrome et Poppler
        run: |
          npm install --prefix /tmp/lecteur playwright@1.56.1
          sudo apt-get -o Acquire::Retries=3 -qq update
          sudo apt-get -o Acquire::Retries=3 -y --no-install-recommends install poppler-utils python3-pil r-base-core r-cran-knitr r-cran-rmarkdown r-cran-tidyverse r-cran-forecast
      - name: Générer les pages, les diaporamas et les téléchargements
        run: python3 scripts/verification-publication/parcours-final-module09.py
