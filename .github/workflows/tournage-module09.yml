name: Produire les capsules enrichies du module 09
on:
  push:
    branches: ['verification/tournage-module09-20261118']
permissions:
  contents: write
jobs:
  supports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MQT_PLAYWRIGHT_MODULE: /tmp/lecteur/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Préparer Chrome et les outils PDF
        run: |
          npm install --prefix /tmp/lecteur playwright@1.56.1
          sudo apt-get -qq update
          sudo apt-get -qq install -y poppler-utils
      - name: Rendre les supports et comparer les géométries
        run: python3 scripts/verification-publication/tournage-module09.py
